{{ define "products" }}
<div id="products" class="flex flex-wrap gap-4">
    {{ range . }}
    {{ block "product" . }}
    {{ end }}
    {{ end }}
</div>
{{ end }}
{{ define "product" }}
<a href="/admin/products/{{ .ID }}">
    <div class="w-48 bg-gray-100 rounded border border-white shadow-sm">
        <div class="py-2 px-4 border-b border-white">
            <strong>{{ .Name }}</strong>
        </div>
        <div class="py-2 px-4">{{ .Description.String }}</div>
    </div>
</a>
{{ end }}
